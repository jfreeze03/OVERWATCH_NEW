# SQLFluff configuration for Flyway Enterprise code review (`flyway check -code`) -- ALFA EDW on Snowflake.
#
# flyway.toml points here: [flyway.check] rulesConfig = "sqlfluff.cfg", rulesDialect = "snowflake". Because
# rulesConfig is set, Flyway hands SQLFluff THIS file alone (--config plus --ignore-local-config): no .sqlfluff,
# setup.cfg or tox.ini in the repository is read, and nothing is merged with Flyway's own conf/sqlfluff.cfg. Flyway
# also always passes --dialect itself (rulesDialect, else the JDBC URL, else ansi), so the `dialect` key below only
# serves a developer who runs open-source SQLFluff by hand (it has no RG rules; it warns that they match nothing):
#     sqlfluff lint --config sqlfluff.cfg migrations/ repeatable/
#
# Severity model (the pipeline runs check -code with -check.code.failOnError=true):
#   * a rule in `rules` that is not also in `warnings` is an ERROR and fails the PR build;
#   * a rule also listed in `warnings` is reported in reports/code/report.html but does not fail the build;
#   * a deliberate exception is marked on its line with `-- noqa: RG13` (any rule code). Flyway lists every noqa as
#     a "Policy Overrides" warning (check.code.noqaSeverity), so reviewers see each one. Where the guard objects as
#     well, the file also needs its `-- FLYWAY-WAIVER: FGnnn <ticket> <reason>` line.
# The guard (`python3 scripts/fw.py guard`, rules FG001-FG020) is the primary, statement-aware gate and runs first;
# this file and the regex rules in rules/ are the Enterprise second line.
#
# Rules are enabled by an explicit list (Redgate's recommendation): a Flyway upgrade that ships new RG rules changes
# nothing until someone adds them here in a reviewed commit. Never combine `rules = RG..` with
# `exclude_rules = redgate`: SQLFluff then drops the whole redgate group.
#
#   code  name                             severity  why it is on for this EDW
#   ----  -------------------------------  --------  -----------------------------------------------------------------
#   RG03  DROP DATABASE                    error     a migration replays on all six runways (guard FG006, unwaivable)
#   RG06  DELETE without WHERE             warning   guard FG006 gates it (ticketed waiver); listed for the reviewer
#   RG09  UPDATE without WHERE             error     rewrites every row; the guard has no rule for it
#   RG08  ALTER USER                       warning   account-level: guard FG007 gates it (belongs in bootstrap/)
#   RG11  CREATE ROLE                      warning   account-level: guard FG007 gates it (belongs in bootstrap/)
#   RG12  PUBLIC role changes              error     grants to PUBLIC reach every user in the account
#   RG13  TRUNCATE                         warning   guard FG006 gates it (ticketed waiver); listed for the reviewer
#   RG01  DROP TABLE                       warning   legitimate in a U undo script that reverses a create (FG006 gates)
#   RG14  DROP COLUMN                      warning   legitimate in a U undo script that reverses an add (FG006 gates)
#   RG07  GRANT statements                 warning   grants are expected in repeatable layer 90; listed for the reviewer
#   AL04  aliasing.unique.table            error     duplicate table alias in one FROM clause is ambiguous
#   AL08  aliasing.unique.column           error     two output columns with one name are ambiguous to every consumer
#   CV05  convention.is_null               error     `= NULL` is never true: a real bug, not style
#   AM04  ambiguous.column_count           warning   SELECT * in a view changes shape when a table gains a column
#   RF02  references.qualification        warning   qualify columns when a query reads several tables
#   ST03  structure.unused_cte             warning   dead CTE (usually a refactoring leftover)
#   ST11  structure.unused_join            warning   a joined table nobody reads still multiplies rows
#   PRS   (parse error, not a rule)        warning   see below
# Layout (LT*) and capitalisation (CP*) rules stay off: existing EDW code would drown real findings in style noise.
#
# PRS: SQLFluff's Snowflake dialect trails Snowflake. In SQLFluff 4.0.0 (the version Flyway's release notes list as
# bundled since 11.20.3) CREATE ALERT, for example, does not parse at all. Listing PRS under `warnings` keeps an
# unparsable statement visible in the report without failing the build. The other rules cannot inspect an
# unparsable statement, which is one more reason the guard runs first; real syntax errors surface in the DEV deploy
# and the MGM / PRD rehearsals.

[sqlfluff]
dialect = snowflake
templater = placeholder
rules = RG03,RG06,RG09,RG08,RG11,RG12,RG13,RG01,RG14,RG07,AL04,AL08,CV05,AM04,RF02,ST03,ST11
warnings = RG01,RG14,RG07,RG06,RG13,RG08,RG11,AM04,RF02,ST03,ST11,PRS
# By default SQLFluff skips any file over 20000 bytes and the build stays green without reviewing it. Large
# procedures and backfills exceed that; 0 lifts the limit so every migration is reviewed.
large_file_skip_byte_limit = 0

# Placeholders. Flyway's documentation does not say whether code review sees a migration before or after ${...}
# replacement (verify on the first PR build). This templater makes both cases parse:
#   * raw text: `WAREHOUSE = ${etl_wh}` or `TO ROLE ${role_prefix}_SALES_READ` is otherwise an unparsable section;
#     the placeholder templater's flyway_var style (SQLFluff's own style for Flyway's ${name} and ${flyway:name})
#     substitutes the lint-only values below;
#   * already replaced text: nothing is left to substitute, so the templater changes nothing.
# A placeholder missing from this list is replaced by its own name, which still parses as an identifier, so a newly
# declared placeholder never breaks code review. The values are neutral on purpose: never an ALFA_EDW_ name (ALFA01).
# A PRS warning that points at a ${...} position means Flyway is not applying this templater: report it.
[sqlfluff:templater:placeholder]
param_style = flyway_var
env = LINT
edw_db = EDW_LINT_DB
home_db = EDW_LINT_DB
etl_wh = WH_EDW_ETL_LINT
role_prefix = EDW_LINT
tasks_enabled = false
deploy_id = LINT-0
git_sha = unknown
build_url = manual
approver = manual
flyway:environment = LINT
flyway:database = EDW_LINT_DB
flyway:defaultSchema = FLYWAY
flyway:user = SVC_EDW_FLYWAY_LINT
flyway:table = flyway_schema_history
flyway:filename = lint.sql
