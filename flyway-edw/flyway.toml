[environments.RH_MGM]
url = "jdbc:snowflake://${env.SNOWFLAKE_ACCOUNT}.snowflakecomputing.com/?db=${env.FLYWAY_RH_DB}&warehouse=${env.FLYWAY_SF_WAREHOUSE}&role=${env.FLYWAY_SF_ROLE}&JDBC_QUERY_RESULT_FORMAT=JSON"
