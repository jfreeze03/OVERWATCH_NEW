# ALFA04 -- no DROP DATABASE, CREATE OR REPLACE DATABASE or CREATE OR REPLACE SCHEMA.   Flyway Enterprise regex rule.
#
# Why: a migration replays on all six runways. DROP DATABASE / CREATE OR REPLACE DATABASE removes a whole runway, and
# CREATE OR REPLACE SCHEMA is a DROP SCHEMA in disguise: it destroys every object in the schema, including objects
# other projects created there later. Databases are created and retired only by a Snowflake admin (bootstrap/);
# schemas are created with CREATE SCHEMA IF NOT EXISTS ... WITH MANAGED ACCESS. DATABASE ROLE statements are not
# reported (database roles are not databases).
#
# Severity ERROR. Mirror of guard rule FG006, which never waives these forms either, so the two gates agree: no
# waiver and no override makes them shippable. A planned DROP SCHEMA (waivable in the guard with a ticket) is reported
# by ALFA03 as a warning instead (docs/CONVENTIONS.md section 8); this file's name predates that move.
#
# Patterns are TOML literal strings ('...'): the regex is exactly what is written, no backslash escaping.
code = "ALFA04"
dialects = ["TEXT"]
rules = [
    '(?im)^[ \t]*DROP\s+DATABASE\b(?!\s+ROLE\b)',
    '(?im)^[ \t]*CREATE\s+OR\s+REPLACE\s+(?:TRANSIENT\s+)?(?:SCHEMA\b|DATABASE\b(?!\s+ROLE\b))',
]
description = "DROP DATABASE / CREATE OR REPLACE SCHEMA|DATABASE: never allowed in a migration (guard FG006, unwaivable)"
# DROP SCHEMA (waivable in the guard) moved to ALFA03 as a warning.
severity = "error"
