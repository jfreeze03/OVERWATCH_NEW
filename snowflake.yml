# Snowflake CLI project definition for Streamlit-in-Snowflake deploys.
# Usage: snow streamlit deploy --replace
definition_version: 2
entities:
  overwatch:
    type: streamlit
    identifier:
      name: OVERWATCH_APP
      database: DBA_MAINT_DB
      schema: OVERWATCH
    stage: DBA_MAINT_DB.OVERWATCH.OVERWATCH_STAGE
    main_file: streamlit_app.py
    query_warehouse: WH_ALFA_ADMIN
    # Warehouse runtime by contract: omit runtime_name, compute_pool, and
    # artifact_repositories. If this app previously ran on a container, run
    # snowflake/warehouse_runtime_reset.sql once before saving App settings.
    title: "OVERWATCH — Snowflake Command Center"
    # Every file the app reads at runtime must be listed: Alerts > Native delivery shows BOTH
    # snowflake/ templates (tests/test_deploy_artifacts.py locks the pair). Deploy from a clean,
    # committed tree -- the secret scan checks tracked files, and these ship to every viewer.
    artifacts:
      - streamlit_app.py
      - environment.yml
      - app/
      - snowflake/native_alert_templates.sql
      - snowflake/webhook_delivery.sql
