# Colors MUST match app/ui/palette.py (ACCENT/BG/SURFACE/INK). Enforced by
# tests/test_palette_drift.py so native-widget chrome never drifts from the
# cards beside it. Edit palette.py + these together, not one alone.
[theme]
base = "dark"
primaryColor = "#6e8bff"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#141821"
textColor = "#e9edf5"

[server]
headless = true

[browser]
gatherUsageStats = false
