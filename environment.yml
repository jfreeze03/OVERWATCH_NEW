# Streamlit-in-Snowflake environment (Snowflake Anaconda channel).
# Streamlit is pinned to the Wave 1 warehouse-runtime target; the owner still
# performs the final SiS deployment smoke. Other packages stay loose because
# the Snowflake channel lags PyPI; environment.yml and requirements.txt
# intentionally have different constraints.
name: overwatch
channels:
  - snowflake
dependencies:
  - streamlit=1.52.2
  - pandas
  - altair
  - snowflake-snowpark-python
