name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_snowflake_smoke:
        description: "Run the OPTIONAL Snowflake integration smoke (needs SNOWFLAKE_* repo secrets)."
        type: boolean
        default: false

# A newer push to the same branch/PR supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (style + blind-except ban)
        run: ruff check .
      - name: "Mypy (pure layers: logic + data + config)"
        run: mypy
      - name: Pytest (logic + data layers + page smokes)
        run: pytest -q

  # Floor compatibility: the exact minimums the requirements promise. Catches
  # accidental reliance on newer Streamlit/altair/pandas APIs before a deploy
  # to an environment (like the SiS conda channel) that lags PyPI.
  floor-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install FLOOR-pinned runtime + FULL test toolchain
        run: |
          # Floor-pin the RUNTIME libs, but install the full test toolchain too:
          # pytest collects the WHOLE suite, and tests/test_migrations_parse.py
          # imports sqlglot — omitting it made collection error out (every test
          # in the run reported as a collection failure), masking real floor
          # regressions. Keep this list in sync with requirements-dev.txt's
          # test-only deps.
          #
          # streamlit==1.52.2 is the REAL floor: it is the exact version the SiS
          # conda channel deploys (see environment.yml), and requirements.txt
          # pins streamlit~=1.52 because the width='stretch'/'content' string API
          # (the use_container_width successor) does not exist before 1.52. This
          # pin MUST equal the requirements floor — pinning an older streamlit
          # here tests a fictional environment the requirements no longer promise.
          #
          # altair==5.5.0 (not 5.4.0): streamlit 1.52.2 declares
          # `altair!=5.4.0,!=5.4.1,<7,>=4.0` — it BLACKLISTS the entire 5.4 line
          # (there is no 5.4.2), so 5.4.0 is not co-installable with the streamlit
          # floor. 5.5.0 is the lowest altair that satisfies both the streamlit
          # exclusion and requirements.txt's altair~=5.5.
          pip install "streamlit==1.52.2" "pandas==2.2.0" "altair==5.5.0" \
                      "jinja2==3.1.2" "pytest~=8.3" "sqlglot>=30.12.0"
      - name: Page smokes + logic tests on the floor pins
        run: pytest -q

  # OPTIONAL Snowflake integration smoke (Wave 3 #32). OPT-IN and NON-BLOCKING:
  # it runs ONLY on a manual workflow_dispatch with run_snowflake_smoke=true, is
  # not a required status check, and is continue-on-error, so a red run can never
  # gate a merge. It exercises the deploy chain end-to-end against a THROWAWAY
  # zero-copy clone of the database and drops it on exit. Configure SNOWFLAKE_*
  # repo secrets to enable it; without them the job self-skips cleanly.
  #
  # ============================ ISOLATION CONTRACT =============================
  # The migration/validate/task_audit SQL is NOT clone-safe on its own: every
  # object is FULLY-QUALIFIED as DBA_MAINT_DB.OVERWATCH.*, and 16 migrations even
  # issue `USE DATABASE DBA_MAINT_DB;`, which OVERRIDES the connection's
  # --database default. So selecting --database $CLONE_DB is NOT enough — applied
  # verbatim, this job would redefine PROD procs, disable routes, resume tasks,
  # and run loaders against production DBA_MAINT_DB regardless of the clone.
  # Account-level objects are not cloned at all: V002 creates WH_ALFA_ADMIN, sets
  # its statement timeout to 300 s and attaches a 30-credit SUSPEND resource
  # monitor; V006-V008 grant to the retired OVERWATCH_* roles; tasks run on
  # WH_ALFA_ADMIN, and the cloned task ROOTS (CREATE TASK IF NOT EXISTS, so never
  # redefined in the clone) still CALL the production procedures once resumed.
  #
  # LAYER 1 (the "Rewrite SQL onto the clone" step): before anything is applied,
  # .github/scripts/snowflake_smoke_rewrite.py COPIES every .sql file the smoke
  # runs (migrations, validate.sql, task_audit.sql) into a temp dir and:
  #   * rewrites the identifier DBA_MAINT_DB, in any letter case, to $CLONE_DB
  #     (schema kept);
  #   * comments out the account-level statements (warehouse and resource
  #     monitor DDL, grants to the retired roles, EXECUTE TASK);
  #   * moves task compute to $CI_WAREHOUSE and keeps every task SUSPENDED
  #     (ALTER TASK ... RESUME -> SUSPEND, no SYSTEM$TASK_DEPENDENTS_ENABLE);
  #   * starts each copy with USE SECONDARY ROLES NONE;
  #   * FAILS CLOSED (writes nothing, exit 1) unless every top-level statement
  #     is a kind the chain is known to use (an ALLOWLIST: schema-object DDL,
  #     DML, CALL, anonymous blocks, reads, USE), and if any code, $$ bodies
  #     included, still names DBA_MAINT_DB (any case) or WH_ALFA_ADMIN; names
  #     a database other than the clone as a DDL / COMMENT / write / CALL /
  #     USE target (in any form: quoted or not, with or without a space after
  #     the keyword, db..object); runs CREATE / ALTER / DROP / UNDROP /
  #     COMMENT ON of a kind whose name it cannot read (ALTER SESSION
  #     included), IDENTIFIER(), TABLE() of a literal or variable, or
  #     EXECUTE IMMEDIATE of anything but a literal, a $$ block or a
  #     :variable; carries a GRANT or REVOKE,
  #     warehouse / monitor / account / user / integration / role / share /
  #     network-policy / database DDL, a role or warehouse switch, a task
  #     start or any other EXECUTE, an external stage, unload, file copy or
  #     stage file removal, a body in a language other than SQL, or a
  #     SYSTEM$ function off its allowlist; or CALLs SP_NOTIFY_WEBHOOK or
  #     SP_DAILY_DIGEST (top level, nested in a $$ body, or in a dynamic-SQL
  #     string) anywhere but a suspended task's own body. A comment between
  #     two tokens reads as whitespace (--, // and /* */, as Snowflake reads
  #     them), and "code" includes a '...' literal handed straight to EXECUTE
  #     IMMEDIATE (the first piece when it is concatenated) or given as a
  #     body after AS, read as the SQL it runs.
  #   * FAILS CLOSED, too, on what the client (snow sql) reads differently
  #     from Snowflake: outside a $$ body, a // comment, a backslash in a
  #     "quoted" name, a line starting with ! (!source of a file or a URL) or
  #     a /* */ comment with no space on either side (the client deletes it,
  #     joining two tokens); and anywhere, client template syntax (<%, {#,
  #     &{, &name), which snow sql renders from the job's environment. In
  #     any '...' string it refuses an escape it cannot decode in place
  #     (\x, \u, octal, \b, \f): a string can run as SQL.
  # The smoke only ever executes the rewritten copies. What keeps it off the
  # account's real notification integrations is that every clone task stays
  # SUSPENDED and EXECUTE TASK is refused, so the notifier and digest task
  # bodies never run, plus layer 1's ban on any CALL of SP_NOTIFY_WEBHOOK or
  # SP_DAILY_DIGEST and on any SYSTEM$SEND_* outside their own definitions.
  # Step 0's ALERT_ROUTES disable is NOT that guarantee: it stops only the
  # Teams legs. V164's CRITICAL escalation emails ESCALATE_EMAIL_INTEGRATION
  # whatever the routes say, so step 0 also sets ESCALATE_AFTER_MIN to '0' and
  # blanks ESCALATE_EMAIL_INTEGRATION in the clone (belt and braces). A send
  # reached only through SQL built at run time (EXECUTE IMMEDIATE of a
  # variable, or a CALLed procedure that does that) is beyond a text check and
  # rests on layer 2: the CI role must hold no USAGE on any notification
  # integration (step 5 below). So does account-level or other-database SQL
  # held in a variable or in the pieces of a concatenation after its first
  # literal: layer 1 reads only the literal EXECUTE IMMEDIATE is handed.
  #
  # ####################### OWNER ACTION REQUIRED (role) ########################
  # LAYER 2 (defense-in-depth, fail-closed) is a DEDICATED CI ROLE that has NO
  # WRITE on production DBA_MAINT_DB, so that even a rewrite miss or a future
  # hand-written query cannot mutate prod. The workflow SELECTS this role via the
  # SNOWFLAKE_CI_ROLE secret (wired into sql() below) and ENFORCES it: before the
  # clone it refuses to run when the role, with secondary roles off, inherits
  # ACCOUNTADMIN, SYSADMIN, SECURITYADMIN, SNOW_ACCOUNTADMINS or SNOW_SYSADMINS.
  # It CANNOT create the role — an account admin (the OWNER) must:
  #   1. CREATE ROLE OVERWATCH_CI_SMOKE;   (name is illustrative)
  #   2. GRANT CREATE DATABASE ON ACCOUNT TO ROLE OVERWATCH_CI_SMOKE;
  #        (needed to CREATE DATABASE ... CLONE and DROP the throwaway clone)
  #   3. GRANT USAGE ON WAREHOUSE <CI_WH> TO ROLE OVERWATCH_CI_SMOKE;
  #        (a CI warehouse, e.g. WH_CI_SMOKE — NOT a prod admin warehouse)
  #   4. GRANT USAGE ON DATABASE DBA_MAINT_DB TO ROLE OVERWATCH_CI_SMOKE;
  #      GRANT USAGE ON SCHEMA DBA_MAINT_DB.OVERWATCH TO ROLE OVERWATCH_CI_SMOKE;
  #      GRANT SELECT ON ALL TABLES IN SCHEMA DBA_MAINT_DB.OVERWATCH TO ROLE ...;
  #        (READ-ONLY on the source — required to zero-copy clone it)
  #   5. Explicitly grant NO write on prod: the CI role must NOT hold OWNERSHIP,
  #      INSERT/UPDATE/DELETE/TRUNCATE, CREATE <object>, or MODIFY on
  #      DBA_MAINT_DB or DBA_MAINT_DB.OVERWATCH.*, and must NOT inherit them via
  #      SNOW_SYSADMINS or any prod admin role. Cloning READS prod; it never
  #      writes, so USAGE + SELECT on the source is sufficient and fail-closed.
  #      It must also hold NO USAGE on any NOTIFICATION INTEGRATION (the
  #      OVERWATCH_EMAIL email, the Teams webhook), so a send the layer-1 text
  #      checks cannot see has no channel.
  #   6. GRANT ROLE OVERWATCH_CI_SMOKE TO USER <ci_user>; and set repo secrets
  #      SNOWFLAKE_CI_ROLE=OVERWATCH_CI_SMOKE and SNOWFLAKE_CI_WAREHOUSE=<dedicated wh>.
  # KNOWN GAP (why the job is still non-gating): a database clone keeps its child
  # objects' source grants, ownership included, so a role with only SELECT on the
  # source cannot MERGE into or CREATE OR REPLACE the clone's children — the run
  # stops at the clone's ALERT_ROUTES update (or in V001) until the owner also
  # hands the clone's children to the CI role. That is a separate, privileged
  # step this workflow deliberately does not perform: it never holds a
  # prod-admin credential. A stop there is fail-closed: nothing was applied.
  # R38 (fail-closed): if SNOWFLAKE_CI_ROLE or SNOWFLAKE_CI_WAREHOUSE is unset, the run
  # step SKIPS (exit 0) instead of falling back to the prod role / prod admin warehouse —
  # the isolation prerequisites are now enforced, not merely preferred. Prod safety still
  # ALSO rests on the text-rewrite + guard below; the job stays opt-in + continue-on-error.
  # ============================================================================
  snowflake-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_snowflake_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NON-BLOCKING: never gates merge. See "GATING FLIP" TODO at the end of the
    # apply step before removing this.
    continue-on-error: true
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      # Dedicated fail-closed CI role with NO write on prod DBA_MAINT_DB. OWNER
      # must create it (see ISOLATION CONTRACT above). Preferred over the prod
      # SNOWFLAKE_ROLE when set.
      SNOWFLAKE_CI_ROLE: ${{ secrets.SNOWFLAKE_CI_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      # Dedicated CI warehouse (R38). Required alongside SNOWFLAKE_CI_ROLE — the smoke
      # SKIPS rather than run on the prod admin warehouse if this is unset.
      SNOWFLAKE_CI_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE }}
      SNOWFLAKE_DATABASE: DBA_MAINT_DB
    steps:
      - uses: actions/checkout@v4
      - name: Guard — skip cleanly when secrets are absent
        id: guard
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ] || [ -z "$SNOWFLAKE_USER" ] || [ -z "$SNOWFLAKE_PASSWORD" ]; then
            echo "Snowflake secrets not configured — skipping the optional integration smoke."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Install Snowflake CLI
        if: steps.guard.outputs.run == 'true'
        run: pip install "snowflake-cli-labs>=2.5"
      - name: Migrations + validate + loader + route-ledger on a throwaway clone
        if: steps.guard.outputs.run == 'true'
        env:
          CLONE_DB: OVERWATCH_CI_SMOKE_${{ github.run_id }}
        run: |
          set -euo pipefail
          # R38: fail CLOSED on the isolation prerequisites. The smoke must run under a
          # DEDICATED, least-privilege CI role on a DEDICATED warehouse — never silently
          # fall back to the prod role / prod admin warehouse. If either isn't provisioned,
          # SKIP the smoke rather than touch production-capable compute. (The job is already
          # opt-in via workflow_dispatch + continue-on-error; skipping here is safe.)
          if [ -z "${SNOWFLAKE_CI_ROLE:-}" ] || [ -z "${SNOWFLAKE_CI_WAREHOUSE:-}" ]; then
            echo "SKIP: SNOWFLAKE_CI_ROLE and/or SNOWFLAKE_CI_WAREHOUSE not set — refusing to run"
            echo "the smoke under a prod-capable role/warehouse. Provision the isolated CI role"
            echo "+ warehouse (see the contract above) to enable it."
            exit 0
          fi
          CI_ROLE="$SNOWFLAKE_CI_ROLE"
          CI_WAREHOUSE="$SNOWFLAKE_CI_WAREHOUSE"
          echo "Smoke will connect under role: $CI_ROLE / warehouse: $CI_WAREHOUSE"
          sql() { snow sql --temporary-connection \
                    --account "$SNOWFLAKE_ACCOUNT" --user "$SNOWFLAKE_USER" \
                    --role "$CI_ROLE" \
                    --warehouse "$CI_WAREHOUSE" \
                    --database "$CLONE_DB" "$@"; }

          # ---- Rewrite SQL onto the clone (ISOLATION, layer 1) ---------------
          # Copies every .sql the smoke runs into a temp dir, rewrites it onto the
          # clone and fails closed (exit 1, nothing written) on anything
          # account-level it cannot neutralize — see the ISOLATION CONTRACT above.
          REWRITE_DIR="$(mktemp -d)"
          python .github/scripts/snowflake_smoke_rewrite.py --out "$REWRITE_DIR" \
            --clone-db "$CLONE_DB" --ci-warehouse "$CI_WAREHOUSE"

          # ---- Fail-closed guard: abort BEFORE applying if any prod ref remains
          #      (case-insensitive: Snowflake folds unquoted identifiers to upper case)
          if grep -rIil 'DBA_MAINT_DB' "$REWRITE_DIR" >/dev/null 2>&1; then
            echo "FATAL: SQL rewrite incomplete — DBA_MAINT_DB still present in:" >&2
            grep -rIil 'DBA_MAINT_DB' "$REWRITE_DIR" >&2
            echo "Refusing to apply: the smoke must never touch production." >&2
            exit 1
          fi
          echo "Rewrite verified: no DBA_MAINT_DB reference remains in the SQL to apply."

          # ---- Role check (ISOLATION, layer 2, enforced) ----------------------
          # Secondary roles off, so the session holds the CI role's own privileges
          # only; refuse a role that inherits a production admin role. The result
          # token is built by concatenation, so the query text never contains it.
          ROLE_CHECK="$(snow sql --temporary-connection --account "$SNOWFLAKE_ACCOUNT" \
                   --user "$SNOWFLAKE_USER" --role "$CI_ROLE" \
                   --warehouse "$CI_WAREHOUSE" \
                   -q "USE SECONDARY ROLES NONE; SELECT 'ROLE_CHECK_' || IFF(IS_ROLE_IN_SESSION('ACCOUNTADMIN') OR IS_ROLE_IN_SESSION('SYSADMIN') OR IS_ROLE_IN_SESSION('SECURITYADMIN') OR IS_ROLE_IN_SESSION('SNOW_ACCOUNTADMINS') OR IS_ROLE_IN_SESSION('SNOW_SYSADMINS'), 'REFUSED', 'PASSED') AS RESULT;")"
          echo "$ROLE_CHECK"
          if ! printf '%s' "$ROLE_CHECK" | grep -q 'ROLE_CHECK_PASSED'; then
            echo "FATAL: $CI_ROLE inherits a production admin role (or the check did not run)." >&2
            echo "Refusing to apply: provision the isolated CI role (ISOLATION CONTRACT above)." >&2
            exit 1
          fi

          # Zero-copy clone of the prod DB into a throwaway; always drop it on exit.
          # (CREATE/DROP need the connection role; sql() targets the clone db.)
          snow sql --temporary-connection --account "$SNOWFLAKE_ACCOUNT" \
                   --user "$SNOWFLAKE_USER" --role "$CI_ROLE" \
                   --warehouse "$CI_WAREHOUSE" \
                   -q "CREATE DATABASE $CLONE_DB CLONE $SNOWFLAKE_DATABASE;"
          cleanup() {
            snow sql --temporary-connection --account "$SNOWFLAKE_ACCOUNT" \
                     --user "$SNOWFLAKE_USER" --role "$CI_ROLE" \
                     --warehouse "$CI_WAREHOUSE" \
                     -q "DROP DATABASE IF EXISTS $CLONE_DB;" || true
          }
          trap cleanup EXIT
          # 0. Delivery off IN THE CLONE before anything runs (belt and braces: the
          #    guarantee is the suspended tasks + layer 1's notifier-CALL ban).
          #    Notification integrations are account-level, so an enabled cloned
          #    route would post through the real Teams integration, and V164's
          #    CRITICAL escalation emails ESCALATE_EMAIL_INTEGRATION whatever the
          #    routes say: escalation goes off ('0') and its email leg blank. A MERGE,
          #    so a missing key is inserted; V164 seeds them WHEN NOT MATCHED only,
          #    so the replay keeps these values.
          sql -q "USE SECONDARY ROLES NONE; UPDATE $CLONE_DB.OVERWATCH.ALERT_ROUTES SET ENABLED = FALSE; MERGE INTO $CLONE_DB.OVERWATCH.SETTINGS t USING (SELECT * FROM VALUES ('ESCALATE_AFTER_MIN', '0'), ('ESCALATE_EMAIL_INTEGRATION', '') AS s(KEY, VALUE)) s ON t.KEY = s.KEY WHEN MATCHED THEN UPDATE SET VALUE = s.VALUE WHEN NOT MATCHED THEN INSERT (KEY, VALUE) VALUES (s.KEY, s.VALUE);"
          # 1. Migrations in order — REWRITTEN copies (clone-scoped, never prod).
          #    Additive; the clone already has prod state, so this proves the
          #    chain re-applies cleanly / is idempotent. Every task stays suspended.
          for f in $(ls "$REWRITE_DIR"/migrations/V*.sql | sort); do
            echo "== apply $f"; sql -f "$f"
          done
          # 2. Structural validation — REWRITTEN copy; every row must read OK.
          sql -f "$REWRITE_DIR/validate.sql"
          # 3. Exercise one loader end-to-end (fast, self-contained).
          sql -q "USE SECONDARY ROLES NONE; CALL $CLONE_DB.OVERWATCH.SP_LOAD_DAILY_FACTS();"
          # 4. Route-ledger check: no ENABLED alert route may name a blank
          #    integration (a delivery dead-route). Fails the step if any exist.
          sql -q "USE SECONDARY ROLES NONE; SELECT IFF(COUNT(*) = 0, 'ROUTE LEDGER OK', 'FAIL: enabled route with blank integration') AS RESULT
                  FROM $CLONE_DB.OVERWATCH.ALERT_ROUTES
                  WHERE ENABLED AND (INTEGRATION_NAME IS NULL OR TRIM(INTEGRATION_NAME) = '');"
          # NOTE: account-specific bits (role/warehouse names, auth method) may
          # need tuning for your tenant. The job is opt-in + non-blocking by
          # design, so a mismatch here can never block a merge.
          #
          # ======================= GATING FLIP (P1 TODO) ======================
          # validate.sql now RAISEs on a bad row (its EXECUTE IMMEDIATE contract),
          # so `sql -f validate.sql` already exits nonzero on a real failure — the
          # first flip precondition is MET. The remaining blockers are the OWNER
          # provisioning SNOWFLAKE_CI_ROLE (a role with NO write on prod
          # DBA_MAINT_DB — see ISOLATION CONTRACT above) and the clone-ownership
          # gap the contract names. Make this a real gate only in this order:
          #   a. Confirm the CI role secret is set and the smoke connects under it
          #      (the "Smoke will connect under role:" line must NOT show a prod
          #      admin role such as SNOW_SYSADMINS, and ROLE_CHECK_PASSED prints).
          #   b. See ONE green workflow_dispatch run under that role, end to end:
          #      every migration applied, validate.sql all OK, the loader CALL and
          #      the route-ledger check passed.
          #   c. Remove `continue-on-error: true` from this job.
          #   d. Optionally make snowflake-smoke a REQUIRED status check in branch
          #      protection (and/or run it on pull_request, not only dispatch).
          # DO NOT flip before a and b hold: gating an un-isolated job, or one
          # still running under a prod-write role, would gate merges on the risk of
          # prod mutation, and gating a job that has never passed under the
          # contract role would leave every merge red.
          # ====================================================================
