# Type checking for the PURE layers only (app/logic, app/data are
# Streamlit-free by design; config/companies are plain constants+functions).
# The UI layer is exercised by the AppTest smoke suite instead — Streamlit's
# dynamic API makes mypy noise exceed signal there.
[mypy]
python_version = 3.11
# Wave 3 #45: incrementally onboard the query engine. app/core/query.py is the
# tiered cache/executor the whole app funnels reads through, so type coverage
# here is high-value. Added on its own (a targeted override tames its 3 known
# findings below); the rest of app/core / app/ui remains AppTest-covered for now
# — see the onboarding backlog at the bottom of this file.
files = app/logic, app/data, app/config.py, app/companies.py, app/core/query.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

# numpy 2.x ships PEP 695 `type` statements in its bundled stubs, which mypy
# refuses to parse below python_version 3.12. We deliberately type-check against
# the 3.11 deployment floor, so treat numpy as Any — the same footing pandas
# already has (no bundled stubs + ignore_missing_imports).
[mypy-numpy,numpy.*]
follow_imports = skip
follow_imports_for_stubs = True

# Wave 3 #45: app/core/query.py onboarding — a MINIMAL, justified relaxation for
# exactly two error codes, both false-positive/stylistic in this file. Every
# other check (attr-defined, arg-type, return-value, assignment, ...) IS enforced.
# We can't fix these at the call site right now, so they are suppressed per-module
# instead of with inline `# type: ignore`s. Tighten to line-level ignores (and
# drop this section) when the file is next edited:
#   - union-attr: `_with_row_cap` does re.search(r"\d+", tail.group(0)).group(0)
#     where `tail` already matched `LIMIT \d+`, so the inner search never returns
#     None — mypy can't prove it. Fix: assert/guard the Match before .group().
#   - no-redef: run_batch re-annotates `out: dict = {}` in mutually-exclusive
#     except branches. Fix: annotate once at the top of the function.
[mypy-app.core.query]
disable_error_code = union-attr, no-redef

# ---------------------------------------------------------------------------
# TYPE-COVERAGE ONBOARDING BACKLOG (Wave 3 #45). Modules still checked only via
# the AppTest page smokes, in rough priority order for future incremental adds
# (each will likely need a small targeted override or a few code fixes first):
#   app/core/session.py, app/core/result.py, app/core/errors.py,
#   app/core/identity.py, app/core/sqlsafe.py   (the rest of the core seam)
#   app/ui/** (Streamlit pages — dynamic API; onboard last, if at all)
# Add one module at a time, keep each override minimal + justified like the one
# above, and never force a module that produces a flood of errors.
